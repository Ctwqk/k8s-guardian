apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-guardian-config
data:
  # Safe defaults: dry-run, keyless rule-based analysis, observe-only policy.
  GUARDIAN_DRY_RUN: "true"
  GUARDIAN_ANALYZER: "rules"
  GUARDIAN_POLICY_FILE: "/etc/guardian/policy.yaml"
  GUARDIAN_DB_PATH: "/data/guardian.db"
  GUARDIAN_POLL_INTERVAL_SECONDS: "900"
  GUARDIAN_COOLDOWN_SECONDS: "600"
  GUARDIAN_MAX_ACTIONS_PER_HOUR: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-guardian-policy
data:
  policy.yaml: |
    # Observe-only: nothing is writable and no rule grants remediation.
    # See examples/policy.demo.yaml for a policy that allows restarts in one namespace.
    version: observe-only
    watched_namespaces: ["*"]
    ignored_namespaces: [kube-system, kube-public, kube-node-lease]
    writable_namespaces: []
    rules: []
    default_rule:
      allowed_actions: [do_nothing]
      reason: No rule grants remediation for this workload; human review required.
