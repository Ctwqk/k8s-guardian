apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-guardian
  labels:
    app.kubernetes.io/name: k8s-guardian
spec:
  replicas: 1 # SQLite audit log: exactly one writer
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-guardian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-guardian
    spec:
      serviceAccountName: k8s-guardian
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guardian
          image: k8s-guardian
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: k8s-guardian-config
          env:
            # Optional secrets (create the Secret yourself; never commit it).
            - name: GUARDIAN_LLM_API_KEY
              valueFrom: {secretKeyRef: {name: k8s-guardian-secrets, key: llm-api-key, optional: true}}
            - name: GUARDIAN_DISCORD_WEBHOOK_URL
              valueFrom: {secretKeyRef: {name: k8s-guardian-secrets, key: discord-webhook-url, optional: true}}
            - name: GUARDIAN_API_TOKEN
              valueFrom: {secretKeyRef: {name: k8s-guardian-secrets, key: api-token, optional: true}}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: policy, mountPath: /etc/guardian, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8s-guardian-data
        - name: policy
          configMap:
            name: k8s-guardian-policy
        - name: tmp
          emptyDir: {}
