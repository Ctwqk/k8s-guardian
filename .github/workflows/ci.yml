name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + types + tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t k8s-guardian:ci .
      - name: runs as non-root
        run: test "$(docker run --rm --entrypoint id k8s-guardian:ci -u)" != "0"
      - name: policy shipped in the image validates
        run: docker run --rm --entrypoint sh k8s-guardian:ci -c 'python - <<PY
          from k8s_guardian.policy import load_policy
          p = load_policy()
          assert not p.writable_namespaces, "built-in policy must be observe-only"
          PY'
      - name: one poll against the built-in fake cluster
        run: docker run --rm -e GUARDIAN_BACKEND=fake k8s-guardian:ci once | tee out.json | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] and r['dry_run']"

  manifests:
    name: render kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/k8s/base > /dev/null
      - run: kubectl kustomize deploy/k8s/overlays/demo > /dev/null
      - name: the demo overlay's policy matches examples/policy.demo.yaml
        run: diff examples/policy.demo.yaml deploy/k8s/overlays/demo/policy.yaml

  e2e:
    name: e2e on a kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: crash-looping workloads vs. the guardian
        run: OUT=e2e-out scripts/kind-demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-transcript
          path: e2e-out/
          if-no-files-found: ignore
